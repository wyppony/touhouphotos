<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IndexedDB 多媒体留存器</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui, sans-serif}
body{padding:16px;background:#1a1a22;color:#eee;max-width:1200px;margin:0 auto}
section{margin-bottom:24px;padding:16px;border:1px solid #444;border-radius:10px;background:#272733}
h2{margin-bottom:12px;color:#f4c084}
input,button{padding:8px 12px;margin:4px;border-radius:6px;border:none;font-size:14px}
button{background:#4285f4;color:#fff;cursor:pointer}
button:disabled{background:#666;cursor:not-allowed}
#randomBiliBtn{background:#ff7828;}
#mediaContainer{display:grid;grid-template-columns:repeat(auto-fill, minmax(320px,1fr));gap:16px;margin-top:12px}
.media-card{background:#333;padding:12px;border-radius:8px}
.media-card video,.media-card img{
  width:100%;
  max-height:400px;
  object-fit:contain;
  background:#000
}
.media-card audio{width:100%;margin:8px 0;}
.bili-frame{width:100%;height:240px;border:0;border-radius:6px}
.del-btn{background:#d33;margin-top:8px}
#log{color:#aaa;font-size:13px;margin-top:8px;min-height:20px}
</style>
</head>
<body>
<h1>IndexedDB 多媒体留存器</h1>
<section>
  <h2>1. 上传本地媒体（图片/视频/音频，全部原文件保存，不转码不压缩）</h2>
  <input type="file" id="fileInput" multiple accept="image/*,video/*,audio/*">
  <button id="clearAll">清空全部媒体</button>
  <div id="log"></div>
</section>
<section>
  <h2>2. B站视频嵌入（BV号 / B站链接 / 🎲盲盒）</h2>
  <input id="biliInput" placeholder="输入BV号或https://www.bilibili.com/video/BVxxxx">
  <button id="addBiliBtn">添加B站嵌入</button>
  <button id="randomBiliBtn">🎲随机一个b站视频</button>
</section>
<section>
  <h2>媒体库</h2>
  <div id="mediaContainer"></div>
</section>
<script>
// ===== IndexedDB 封装 =====
const DB_NAME = "MediaStoreDB";
const DB_VER = 1;
let db;
function openDB(){
  return new Promise((res,rej)=>{
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e=>{
      db = e.target.result;
      db.createObjectStore("medias",{keyPath:"id"});
    };
    req.onsuccess = e=>{
      db = e.target.result; res(db);
    };
    req.onerror = e=>rej(e.target.error);
  })
}
async function saveMedia(item){
  const tx = db.transaction("medias","readwrite");
  const st = tx.objectStore("medias");
  await st.put(item);
}
async function deleteMedia(id){
  const tx = db.transaction("medias","readwrite");
  const st = tx.objectStore("medias");
  await st.delete(id);
}
async function getAllMedias(){
  return new Promise((res,rej)=>{
    const tx = db.transaction("medias","readonly");
    const st = tx.objectStore("medias");
    const req = st.getAll();
    req.onsuccess=()=>res(req.result);
    req.onerror=e=>rej(e.target.error);
  })
}
async function clearAll(){
  const tx = db.transaction("medias","readwrite");
  await tx.objectStore("medias").clear();
}

// ===== B站 AV <-> BV 算法 用于生成随机BV盲盒 =====
const table = "fZodR9XQDSUm21yCkr6zBqiveYah8bt4xsWpHnJE7jL5VG3guMTKNPAwcF";
const s = [11, 10, 3, 8, 4, 6];
const xor_code = 177451812;
const add_code = 8728348608;

function av2bv(av){
    let x = (av ^ xor_code) + add_code;
    let r = Array.from("BV1  4 1 7  ");
    for(let i=0;i<6;i++){
        r[s[i]] = table[Math.floor(x / (58 ** i)) % 58];
    }
    return r.join("");
}

// 生成随机合法格式BV
function getRandomBv(){
    const randAv = Math.floor(Math.random() * (2**40));
    return av2bv(randAv);
}

// ===== B站BV解析 =====
function parseBv(inputStr){
  let bv = inputStr.trim();
  const match = inputStr.match(/BV([A-Za-z0-9]+)/);
  if(match) bv = "BV"+match[1];
  return bv;
}

// ===== 渲染媒体列表【修复audio标签闭合bug】 =====
async function renderList(){
  const container = document.getElementById("mediaContainer");
  container.innerHTML="";
  const list = await getAllMedias();
  list.forEach(item=>{
    const card = document.createElement("div");
    card.className="media-card";
    if(item.type==="video"){
      const blobUrl = URL.createObjectURL(item.blob);
      card.innerHTML = `
        <video controls src="${blobUrl}"></video>
        <p>${item.name}</p>
        <button class="del-btn" data-id="${item.id}">删除</button>
      `;
    }else if(item.type==="audio"){
      const blobUrl = URL.createObjectURL(item.blob);
      card.innerHTML = `
        <audio controls src="${blobUrl}">
        <p>${item.name}</p>
        <button class="del-btn" data-id="${item.id}">删除</button>
      `;
    }else if(item.type==="image"){
      const blobUrl = URL.createObjectURL(item.blob);
      card.innerHTML = `
        <img src="${blobUrl}">
        <p>${item.name}</p>
        <button class="del-btn" data-id="${item.id}">删除</button>
      `;
    }else if(item.type==="bilibili"){
      card.innerHTML = `
        <iframe class="bili-frame" src="https://player.bilibili.com/player.html?bvid=${item.bv}&page=1"></iframe>
        <p>B站盲盒: ${item.bv}</p>
        <button class="del-btn" data-id="${item.id}">删除</button>
      `;
    }
    container.appendChild(card);
  })
  // 删除事件绑定
  document.querySelectorAll(".del-btn").forEach(btn=>{
    btn.onclick=async ()=>{
      await deleteMedia(btn.dataset.id);
      renderList();
    }
  })
}

// ===== 上传：完全原样保存，没有任何缩放/转码逻辑 =====
document.getElementById("fileInput").onchange = async e=>{
  const log = document.getElementById("log");
  const files = Array.from(e.target.files);
  log.textContent = "处理中...";
  for(const f of files){
    try{
      const id = Date.now() + Math.random().toString(36);
      await saveMedia({
        id,
        name:f.name,
        type: f.type.startsWith("video/") ? "video" : f.type.startsWith("audio/") ? "audio" : "image",
        blob:f
      })
    }catch(err){
      log.textContent += ` 失败:${f.name},${err.message}`
    }
  }
  log.textContent = "上传完成";
  renderList();
  e.target.value = "";
}

// B站手动添加
document.getElementById("addBiliBtn").onclick = async ()=>{
  const input = document.getElementById("biliInput");
  const bv = parseBv(input.value);
  if(!bv.startsWith("BV")){
    alert("无法识别BV号");return;
  }
  const id = Date.now().toString(36);
  await saveMedia({
    id,
    type:"bilibili",
    bv
  })
  input.value="";
  renderList();
}

// 🎲 随机盲盒按钮点击事件
document.getElementById("randomBiliBtn").onclick = async ()=>{
    const bv = getRandomBv();
    const id = Date.now().toString(36);
    await saveMedia({
        id,
        type:"bilibili",
        bv:bv
    });
    renderList();
};

document.getElementById("clearAll").onclick = async ()=>{
  if(confirm("确定清空全部媒体？旧损坏条目也会被清除")){
    await clearAll();
    renderList();
  }
}

// 初始化
(async ()=>{
  await openDB();
  await renderList();
})()
</script>
</body>
</html>
